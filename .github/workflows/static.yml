name: Deploy HireSphere to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "gateway/**"
      - "services/**"
      - "assets/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p pages-dist/shared
          cp gateway/index.html pages-dist/index.html
          cp gateway/app.js pages-dist/shell.js
          cp gateway/styles.css pages-dist/shell.css
          cp services/shared/base.css pages-dist/shared/base.css
          cp services/shared/runtime.js pages-dist/shared/runtime.js
          if [ -d assets ]; then cp -R assets pages-dist/assets; fi
          for service in workspace jobs projects network interview profile hr-studio scale; do
            mkdir -p "pages-dist/$service"
            cp "services/$service/index.html" "pages-dist/$service/index.html"
            cp "services/$service/app.js" "pages-dist/$service/app.js"
            cp "services/$service/styles.css" "pages-dist/$service/styles.css"
          done
          cp pages-dist/index.html pages-dist/404.html
          touch pages-dist/.nojekyll

      - name: Verify Pages artifact
        run: |
          test -f pages-dist/index.html
          test -f pages-dist/shell.js
          test -f pages-dist/shared/runtime.js
          for service in workspace jobs projects network interview profile hr-studio scale; do
            test -f "pages-dist/$service/index.html"
            test -f "pages-dist/$service/app.js"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    name: Deploy Pages Artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
