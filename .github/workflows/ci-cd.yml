name: HireSphere CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_DIR: .
  CHART_PATH: charts/hiresphere
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/hiresphere
  DOCKERHUB_REPOSITORY: rahultipledocker/hiresphere
  RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME || 'hiresphere' }}
  KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'hiresphere' }}

jobs:
  validate:
    name: Validate Static App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f "$APP_DIR/index.html"
          test -f "$APP_DIR/styles.css"
          test -f "$APP_DIR/app.js"
          test -f "$APP_DIR/Dockerfile"
          test -f "$APP_DIR/nginx.conf"
          test -f "$CHART_PATH/Chart.yaml"
          test -f "$CHART_PATH/values.yaml"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm lint
        run: helm lint "$CHART_PATH"

      - name: Helm template smoke test
        run: |
          helm template "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$KUBE_NAMESPACE" \
            --set fullnameOverride="$RELEASE_NAME" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="ci-${GITHUB_SHA::7}"

  image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata for GHCR
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata for Docker Hub
        id: meta_dockerhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=1.0

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta_ghcr.outputs.tags }}
            ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
