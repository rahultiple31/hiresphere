name: HireSphere CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Kubernetes with Helm"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  APP_DIR: .
  CHART_PATH: charts/hiresphere
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/hiresphere
  RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME || 'hiresphere' }}
  KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'hiresphere' }}

jobs:
  validate:
    name: Validate Static App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f "$APP_DIR/index.html"
          test -f "$APP_DIR/styles.css"
          test -f "$APP_DIR/app.js"
          test -f "$APP_DIR/Dockerfile"
          test -f "$APP_DIR/nginx.conf"
          test -f "$CHART_PATH/Chart.yaml"
          test -f "$CHART_PATH/values.yaml"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm lint
        run: helm lint "$CHART_PATH"

      - name: Helm template smoke test
        run: |
          helm template "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$KUBE_NAMESPACE" \
            --set fullnameOverride="$RELEASE_NAME" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="ci-${GITHUB_SHA::7}"

  image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    environment: production
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME || github.actor }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      HELM_IMAGE_PULL_SECRET_ARGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop when kubeconfig is missing
        if: env.KUBECONFIG_B64 == ''
        run: |
          echo "KUBECONFIG_B64 secret is required for Kubernetes deployment."
          exit 1

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Create namespace
        run: kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure optional GHCR image pull secret
        if: env.GHCR_PULL_TOKEN != ''
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace "$KUBE_NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_PULL_USERNAME" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "HELM_IMAGE_PULL_SECRET_ARGS=--set imagePullSecrets[0].name=ghcr-pull-secret" >> "$GITHUB_ENV"

      - name: Deploy Helm release
        run: |
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$KUBE_NAMESPACE" \
            --set fullnameOverride="$RELEASE_NAME" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="sha-${GITHUB_SHA::7}" \
            --set-string image.digest="${{ needs.image.outputs.image_digest }}" \
            $HELM_IMAGE_PULL_SECRET_ARGS \
            --wait \
            --timeout 5m

      - name: Rollout status
        run: kubectl rollout status deployment/"$RELEASE_NAME" -n "$KUBE_NAMESPACE" --timeout=120s
