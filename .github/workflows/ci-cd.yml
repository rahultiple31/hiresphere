name: HireSphere CI/CD

on:

push:

```
branches:

  - main
  - master
```

pull_request:

```
branches:

  - main
  - master
```

workflow_dispatch:

permissions:

contents: read

packages: write

id-token: write

env:

APP_DIR: .

CHART_PATH: charts/hiresphere

IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/hiresphere

DOCKERHUB_REPOSITORY: rahultipledocker/hiresphere

RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME || 'hiresphere' }}

KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'hiresphere' }}

jobs:

validate:

```
name: Validate Static App

runs-on: ubuntu-latest

steps:

  - name: Checkout Repository

    uses: actions/checkout@v4

  - name: Validate Required Files

    run: |

      test -f "$APP_DIR/index.html"
      test -f "$APP_DIR/styles.css"
      test -f "$APP_DIR/app.js"
      test -f "$APP_DIR/Dockerfile"
      test -f "$APP_DIR/nginx.conf"

      test -f "$CHART_PATH/Chart.yaml"
      test -f "$CHART_PATH/values.yaml"

  - name: Setup Helm

    uses: azure/setup-helm@v4

    with:

      version: v3.15.4

  - name: Helm Lint

    run: |

      helm lint "$CHART_PATH"

  - name: Helm Template Validation

    run: |

      helm template "$RELEASE_NAME" "$CHART_PATH" \
        --namespace "$KUBE_NAMESPACE" \
        --set fullnameOverride="$RELEASE_NAME" \
        --set image.repository="$IMAGE_REPOSITORY" \
        --set image.tag="ci-${GITHUB_SHA::7}"
```

image:

```
name: Build Push Test Image

runs-on: ubuntu-latest

needs: validate

outputs:

  image_digest: ${{ steps.build.outputs.digest }}

steps:

  - name: Checkout Repository

    uses: actions/checkout@v4

  - name: Setup Docker Buildx

    uses: docker/setup-buildx-action@v3

  - name: Login GHCR

    if: github.event_name != 'pull_request'

    uses: docker/login-action@v3

    with:

      registry: ghcr.io

      username: ${{ github.actor }}

      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Login DockerHub

    if: github.event_name != 'pull_request'

    uses: docker/login-action@v3

    with:

      username: ${{ secrets.DOCKERHUB_USERNAME }}

      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Docker Metadata

    id: meta

    uses: docker/metadata-action@v5

    with:

      images: |

        ${{ env.IMAGE_REPOSITORY }}
        ${{ env.DOCKERHUB_REPOSITORY }}

      tags: |

        type=sha,prefix=sha-
        type=ref,event=branch
        type=raw,value=latest,enable={{is_default_branch}}
        type=raw,value=1.0

  - name: Build and Push Image

    id: build

    uses: docker/build-push-action@v6

    with:

      context: ${{ env.APP_DIR }}

      file: ${{ env.APP_DIR }}/Dockerfile

      platforms: linux/amd64

      push: ${{ github.event_name != 'pull_request' }}

      load: true

      tags: |

        ${{ env.DOCKERHUB_REPOSITORY }}:1.0

      labels: ${{ steps.meta.outputs.labels }}

      cache-from: type=gha

      cache-to: type=gha,mode=max

  - name: Test Container Startup

    run: |

      docker run -d \
        --name hiresphere-test \
        -p 8080:8080 \
        ${{ env.DOCKERHUB_REPOSITORY }}:1.0

      sleep 20

      echo "===== Container Status ====="

      docker ps -a

      echo "===== Container Logs ====="

      docker logs hiresphere-test

      curl \
        --retry 10 \
        --retry-delay 2 \
        --retry-connrefused \
        http://localhost:8080/healthz

  - name: Cleanup

    if: always()

    run: |

      docker rm -f hiresphere-test || true
```
