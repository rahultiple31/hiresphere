apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hiresphere-project
  namespace: argocd
spec:
  description: HireSphere production deployment
  sourceRepos:
    - https://github.com/your-org/hiresphere.git
  destinations:
    - namespace: hiresphere
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: Service
    - group: ''
      kind: Secret
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: networking.k8s.io
      kind: Ingress
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: networking.k8s.io
      kind: Ingress
