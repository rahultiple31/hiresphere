apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere-gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere-api
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere-workspace
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere-jobs
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere-projects
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere-network
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere-interview
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere-profile
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere-hr-studio
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiresphere-scale
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hiresphere-project
  namespace: argocd
spec:
  description: HireSphere per-service GitOps project
  sourceRepos:
    - https://github.com/rahultiple31/hiresphere.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: hiresphere
      server: https://kubernetes.default.svc
    - namespace: hiresphere-gateway
      server: https://kubernetes.default.svc
    - namespace: hiresphere-api
      server: https://kubernetes.default.svc
    - namespace: hiresphere-workspace
      server: https://kubernetes.default.svc
    - namespace: hiresphere-jobs
      server: https://kubernetes.default.svc
    - namespace: hiresphere-projects
      server: https://kubernetes.default.svc
    - namespace: hiresphere-network
      server: https://kubernetes.default.svc
    - namespace: hiresphere-interview
      server: https://kubernetes.default.svc
    - namespace: hiresphere-profile
      server: https://kubernetes.default.svc
    - namespace: hiresphere-hr-studio
      server: https://kubernetes.default.svc
    - namespace: hiresphere-scale
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io
      kind: Ingress
