apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
spec:
  project: hiresphere-project
  source:
    repoURL: https://github.com/rahultiple31/hiresphere.git
    targetRevision: main
    path: charts/api
  destination:
    server: https://kubernetes.default.svc
    namespace: hiresphere-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
