<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jobs</title><link rel="stylesheet" href="/shared/base.css"><link rel="stylesheet" href="styles.css"></head><body>
<header class="section-title"><div><span class="eyebrow">Jobs service</span><h1>Search roles, save jobs, and track applications.</h1></div></header>

<div class="grid" id="results" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
