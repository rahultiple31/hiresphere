<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Studio</title><link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="styles.css"></head><body>
<header class="section-title"><div><span class="eyebrow">HR Studio service</span><h1>Create openings and manage the candidate shortlist.</h1></div></header>
<div class="studio-grid"><form id="jobForm"><h2>Create job</h2><label>Title<input name="title" required></label><label>Skills<input name="skills" required placeholder="React, Java"></label><label>Location<select name="location"><option>Remote</option><option>Bengaluru</option><option>Pune</option></select></label><label>Salary LPA<input name="salary" type="number" min="1" required></label><button type="submit">Add job</button></form>
<form id="projectForm"><h2>Create project</h2><label>Title<input name="title" required></label><label>Skills<input name="skills" required></label><label>Budget USD<input name="budget" type="number" min="1" required></label><label>Deadline<input name="deadline" type="date" required></label><button type="submit">Add project</button></form>
<section class="card"><h2>AI candidate matching</h2><div id="candidates"></div></section></div><section class="card created"><h2>Created in this session</h2><div id="created" aria-live="polite"><p class="muted">New jobs and projects appear here.</p></div></section><script type="module" src="app.js"></script></body></html>
