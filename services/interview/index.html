<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview</title><link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="styles.css"></head><body>
<header class="section-title"><div><span class="eyebrow">Interview service</span><h1>Run a focused mock interview with structured feedback.</h1></div><div class="timer"><strong id="timer">20:00</strong><small id="recording">Ready</small></div></header>
<section class="interview-grid"><article class="card stage"><span class="tag">Candidate camera</span><div class="avatar">AK</div><h2>Ananya Kulkarni</h2><p class="muted">Senior Full Stack Engineer</p><div class="actions"><button id="start">Start 20 min</button><button class="secondary" id="camera">Camera on</button><button class="secondary" id="microphone">Mic on</button><button class="secondary" id="end">End</button></div></article>
<form id="chat"><h2>Interview chat</h2><div id="messages" aria-live="polite"></div><label>Message<input id="message" required autocomplete="off"></label><button type="submit">Send</button></form></section>
<section class="card feedback"><h2>STAR feedback</h2><div class="grid"><label>Situation<textarea>Handled a production outage during a release window.</textarea></label><label>Task<textarea>Restore service availability and protect transactions.</textarea></label><label>Action<textarea>Scaled pods, isolated a database lock, and coordinated rollback.</textarea></label><label>Result<textarea>Recovered in 20 minutes with clear follow-up ownership.</textarea></label></div><label>Overall score <input id="score" type="range" min="1" max="5" step="0.5" value="4.5"><output id="scoreOutput">4.5</output></label></section><script type="module" src="app.js"></script></body></html>
