replicaCount: 1

image:
  repository: rahultipledocker/hiresphere-gateway
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

upstreams:
  workspace: workspace-service.hiresphere-workspace.svc.cluster.local:8080
  jobs: jobs-service.hiresphere-jobs.svc.cluster.local:8080
  projects: projects-service.hiresphere-projects.svc.cluster.local:8080
  network: network-service.hiresphere-network.svc.cluster.local:8080
  interview: interview-service.hiresphere-interview.svc.cluster.local:8080
  profile: profile-service.hiresphere-profile.svc.cluster.local:8080
  hrStudio: hr-studio-service.hiresphere-hr-studio.svc.cluster.local:8080
  scale: scale-service.hiresphere-scale.svc.cluster.local:8080
  api: api-service.hiresphere-api.svc.cluster.local:8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
