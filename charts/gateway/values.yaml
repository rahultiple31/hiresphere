replicaCount: 1

image:
  repository: ghcr.io/your-org/hiresphere-gateway
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

upstreams:
  workspace: workspace-service:8080
  jobs: jobs-service:8080
  projects: projects-service:8080
  network: network-service:8080
  interview: interview-service:8080
  profile: profile-service:8080
  hrStudio: hr-studio-service:8080
  scale: scale-service:8080
  api: api-service:8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
