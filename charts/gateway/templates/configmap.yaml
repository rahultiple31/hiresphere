apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.fullname" . }}-nginx
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location /assets/ {
        try_files $uri =404;
        expires 1y;
      }

      location = /workspace { return 308 /workspace/; }
      location = /jobs { return 308 /jobs/; }
      location = /projects { return 308 /projects/; }
      location = /network { return 308 /network/; }
      location = /interview { return 308 /interview/; }
      location = /profile { return 308 /profile/; }
      location = /hr-studio { return 308 /hr-studio/; }
      location = /scale { return 308 /scale/; }
      location = /api { return 308 /api/; }

      location /workspace/ {
        rewrite ^/workspace/(.*)$ /$1 break;
        proxy_pass http://{{ .Values.upstreams.workspace }};
      }
      location /jobs/ {
        rewrite ^/jobs/(.*)$ /$1 break;
        proxy_pass http://{{ .Values.upstreams.jobs }};
      }
      location /projects/ {
        rewrite ^/projects/(.*)$ /$1 break;
        proxy_pass http://{{ .Values.upstreams.projects }};
      }
      location /network/ {
        rewrite ^/network/(.*)$ /$1 break;
        proxy_pass http://{{ .Values.upstreams.network }};
      }
      location /interview/ {
        rewrite ^/interview/(.*)$ /$1 break;
        proxy_pass http://{{ .Values.upstreams.interview }};
      }
      location /profile/ {
        rewrite ^/profile/(.*)$ /$1 break;
        proxy_pass http://{{ .Values.upstreams.profile }};
      }
      location /hr-studio/ {
        rewrite ^/hr-studio/(.*)$ /$1 break;
        proxy_pass http://{{ .Values.upstreams.hrStudio }};
      }
      location /scale/ {
        rewrite ^/scale/(.*)$ /$1 break;
        proxy_pass http://{{ .Values.upstreams.scale }};
      }
      location /api/ {
        proxy_pass http://{{ .Values.upstreams.api }};
      }

      location = /healthz { access_log off; return 200 "ok\n"; }
      location = /index.html {
        try_files /index.html =404;
        expires -1;
      }
      location = / {
        try_files /index.html =404;
        expires -1;
      }
      location / { try_files $uri $uri/ /index.html; }
    }
