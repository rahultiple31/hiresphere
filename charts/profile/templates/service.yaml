apiVersion: v1
kind: Service
metadata:
  name: {{ include "profile.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "profile.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "profile.labels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
